<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sugar Crumb Bakery</title>

    <!-- Import Map Support -->
    <script
      async
      src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"
    ></script>

    <!-- Import Maps -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.4",
          "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
          "framer-motion": "https://esm.sh/framer-motion@12.34.2",
          "lucide-react": "https://esm.sh/lucide-react@0.575.0",
          "react-router-dom": "https://esm.sh/react-router-dom@7.13.0"
        }
      }
    </script>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:wght@300..700&family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <!-- Global Styles -->
    <style>
      body {
        font-family: "Montserrat", sans-serif;
        background-color: #fffdf5;
        overflow-x: hidden;
      }

      h1,
      h2,
      h3,
      .font-display {
        font-family: "Fredoka", sans-serif;
      }

      .font-accent {
        font-family: "Caveat", cursive;
      }

      .font-serif {
        font-family: "Playfair Display", serif;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #fffdf5;
      }

      ::-webkit-scrollbar-thumb {
        background: #ffd1dc;
        border-radius: 10px;
      }

      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
